name: iOS validation and TestFlight
on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios-testflight.yml']
  push:
    branches: [main, feat/native-ios]
    paths: ['ios/**', '.github/workflows/ios-testflight.yml']
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Upload to TestFlight (requires TMDB read token and signing setup)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: Minimum deployment iOS 17 / Swift 6
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - name: Run tests on available iPhone
        working-directory: ios
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if v["name"].startswith("iPhone")))')
          xcodebuild test -project CineSeeker.xcodeproj -scheme CineSeeker -destination "platform=iOS Simulator,id=$DEVICE_ID" -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: ios/build/Tests.xcresult
  beta:
    name: Signed TestFlight upload / current SDK
    if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight
    needs: test
    runs-on: macos-26
    environment: testflight
    defaults:
      run:
        working-directory: ios
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APP_IDENTIFIER: ${{ vars.APP_IDENTIFIER || 'com.projectcagla.cineseeker' }}
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios
      - name: Verify current SDK
        run: |
          xcodebuild -version
          SDK_MAJOR=$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)
          test "$SDK_MAJOR" -ge 26
      - name: Build and upload
        run: bundle exec fastlane ios beta
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CineSeeker-TestFlight
          path: |
            ios/build/*.ipa
            ios/build/*.dSYM.zip
          retention-days: 7
